# Default plugin row for the dsh-llm-proxy bundle.
#
# `providers` and `routes` both start empty so the bundle adds the capability
# without changing traffic: every request keeps the process-wide policy until a
# profile (or the plugin page) adds a provider or a host pattern.
#
# `providers` is volatile: the plugin page writes it into the active profile's
# patch and the running plugin picks the value up without a reload.
- insert:
    - id: llm-proxy
      name: dsh-llm-proxy
      config:
        providers: {}
        routes: {}
